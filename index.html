<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS5 13.60</title>
    <style>
        body {
            background: #000;
            color: #0f0;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        #status {
            font-size: 24px;
            margin-bottom: 20px;
        }
        #log {
            width: 80%;
            height: 60%;
            background: #111;
            border: 1px solid #0f0;
            padding: 10px;
            overflow-y: auto;
            font-size: 12px;
        }
        .line { margin: 2px 0; }
        .error { color: #f00; }
        .success { color: #0f0; }
        .info { color: #ff0; }
    </style>
</head>
<body>
    <div id="status">Initializing...</div>
    <div id="log"></div>
    
    <script>
        window.fw = {
            log: (msg, type = 'info') => {
                const log = document.getElementById('log');
                const line = document.createElement('div');
                line.className = `line ${type}`;
                line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
                log.appendChild(line);
                log.scrollTop = log.scrollHeight;
                console.log(msg);
            },
            setStatus: (msg) => {
                document.getElementById('status').textContent = msg;
            }
        };
    </script>
    <script type="module" src="exploit.js"></script>
</body>
</html>
