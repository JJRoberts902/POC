<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PS5 Research Framework (Firmware 13.60)</title>
    <style>
        body { background-color: #121212; color: #00ff00; font-family: monospace; padding: 20px; }
        #terminal { background-color: #000; border: 1px solid #00ff00; padding: 15px; height: 400px; overflow-y: scroll; margin-bottom: 20px; }
        .error { color: #ff3333; }
        .success { color: #33ff33; }
        button { background-color: #00ff00; color: #000; border: none; padding: 10px 20px; font-family: monospace; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #00cc00; }
    </style>
</head>
<body>
    <h1>PS5 Architecture Research Platform</h1>
    <p>Target Environment: Firmware 13.60</p>
    
    <div id="terminal">
        <div>[!] Framework ready. Awaiting user initialization...</div>
    </div>

    <button id="startButton">Launch Research Session</button>

    <script>
        const logTerminal = document.getElementById('terminal');
        
        // Global logging utility accessible by all imported modules
        window.logger = {
            log: function(msg) {
                let div = document.createElement('div');
                div.innerText = `[*] ${msg}`;
                logTerminal.appendChild(div);
                logTerminal.scrollTop = logTerminal.scrollHeight;
            },
            success: function(msg) {
                let div = document.createElement('div');
                div.className = 'success';
                div.innerText = `[+] ${msg}`;
                logTerminal.appendChild(div);
                logTerminal.scrollTop = logTerminal.scrollHeight;
            },
            error: function(msg) {
                let div = document.createElement('div');
                div.className = 'error';
                div.innerText = `[-] ERROR: ${msg}`;
                logTerminal.appendChild(div);
                logTerminal.scrollTop = logTerminal.scrollHeight;
            }
        };

        document.getElementById('startButton').addEventListener('click', () => {
            window.logger.log("Redirecting to active research session interface...");
            window.location.href = "exploit.html";
        });
    </script>
</body>
</html>
