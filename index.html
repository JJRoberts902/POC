<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>PS5 13.60 Debug</title>
    <style>
        body { background: #000; color: #0f0; font-family: monospace; padding: 20px; }
        .error { color: #f00; }
        .ok { color: #0f0; }
    </style>
</head>
<body>
    <h2>PS5 Browser Detection</h2>
    <div id="out"></div>
    
    <script>
        const out = document.getElementById('out');
        const log = (msg, cls) => {
            out.innerHTML += `<div class="${cls}">${msg}</div>`;
        };
        
        // User Agent
        log('User Agent: ' + navigator.userAgent, 'ok');
        
        // Check features
        const checks = [
            ['BigInt', typeof BigInt],
            ['WebAssembly', typeof WebAssembly],
            ['WebAssembly.Memory', typeof WebAssembly?.Memory],
            ['SharedArrayBuffer', typeof SharedArrayBuffer],
            ['Atomics', typeof Atomics],
            ['Worker', typeof Worker],
            ['MessageChannel', typeof MessageChannel]
        ];
        
        log('<br>Feature Check:', 'ok');
        for (const [name, type] of checks) {
            const ok = type !== 'undefined';
            log(`  ${name}: ${ok ? 'OK' : 'MISSING'}`, ok ? 'ok' : 'error');
        }
        
        // Check window properties
        log('<br>Window Check:', 'ok');
        log(`  window.location: ${window.location}`, 'ok');
        log(`  document.domain: ${document.domain}`, 'ok');
        
        // Try to create SharedArrayBuffer
        log('<br>SAB Test:', 'ok');
        try {
            const sab = new SharedArrayBuffer(1024);
            log('  Created SAB: OK', 'ok');
        } catch(e) {
            log('  SAB Error: ' + e.message, 'error');
        }
        
        // Try WebAssembly
        log('<br>WASM Test:', 'ok');
        try {
            const mem = new WebAssembly.Memory({ initial: 1 });
            log('  Created WASM Memory: OK', 'ok');
        } catch(e) {
            log('  WASM Error: ' + e.message, 'error');
        }
    </script>
</body>
</html>
